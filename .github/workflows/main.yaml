name: "rustup cli build"

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build gqlup targets image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: targets
          tags: vladimirdev635/gqlup-targets:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-targets:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-targets:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Build gqlup linux x86_64
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: x86_64-linux-scratch
          tags: vladimirdev635/gqlup-linux-x86_64:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-linux-x86_64:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-linux-x86_64:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Build gqlup linux arm64
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: aarch64-linux-scratch
          tags: vladimirdev635/gqlup-linux-arm64:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-linux-arm64:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-linux-arm64:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Build gqlup linux x86_64 alpine
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: x86_64-alpine
          tags: vladimirdev635/gqlup-alpine-linux-x86_64:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-alpine-linux-x86_64:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-alpine-linux-x86_64:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Build gqlup linux arm64 alpine
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: aarch64-alpine
          tags: vladimirdev635/gqlup-alpine-linux-arm64:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-alpine-linux-arm64:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-alpine-linux-arm64:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Build gqlup darwin x86_64
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: x86_64-darwin-scratch
          tags: vladimirdev635/gqlup-darwin-x86_64:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-darwin-x86_64:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-darwin-x86_64:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Build gqlup darwin arm64
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: true
          target: aarch64-darwin-scratch
          tags: vladimirdev635/gqlup-darwin-arm64:${{ github.ref_name }}
          cache-from: type=registry,ref=vladimirdev635/gqlup-darwin-arm64:buildcache
          cache-to: type=registry,ref=vladimirdev635/gqlup-darwin-arm64:buildcache,mode=max
          provenance: false
          sbom: false
          build-args: |
            CLI_VERSION=${{ case(github.ref_type == 'tag', github.ref_name, format('{0}-{1}', github.ref_name, github.sha)) }}
      - name: Push gqlup
        run: |
          docker manifest create vladimirdev635/gqlup:${{ github.ref_name }} \
              vladimirdev635/gqlup-linux-x86_64:${{ github.ref_name }} \
              vladimirdev635/gqlup-linux-arm64:${{ github.ref_name }} \
              vladimirdev635/gqlup-darwin-x86_64:${{ github.ref_name }} \
              vladimirdev635/gqlup-darwin-arm64:${{ github.ref_name }}
          docker manifest annotate vladimirdev635/gqlup:${{ github.ref_name }} \
              vladimirdev635/gqlup-linux-x86_64:${{ github.ref_name }} --os linux --arch=amd64
          docker manifest annotate vladimirdev635/gqlup:${{ github.ref_name }} \
              vladimirdev635/gqlup-linux-arm64:${{ github.ref_name }} --os linux --arch=arm64
          docker manifest annotate vladimirdev635/gqlup:${{ github.ref_name }} \
              vladimirdev635/gqlup-darwin-x86_64:${{ github.ref_name }} --os darwin --arch=amd64
          docker manifest annotate vladimirdev635/gqlup:${{ github.ref_name }} \
              vladimirdev635/gqlup-darwin-arm64:${{ github.ref_name }} --os darwin --arch=arm64
          docker manifest push vladimirdev635/gqlup:${{ github.ref_name }}
          docker manifest create vladimirdev635/gqlup-alpine:${{ github.ref_name }} \
              vladimirdev635/gqlup-alpine-linux-x86_64:${{ github.ref_name }} \
              vladimirdev635/gqlup-alpine-linux-arm64:${{ github.ref_name }}
          docker manifest annotate vladimirdev635/gqlup-alpine:${{ github.ref_name }} \
              vladimirdev635/gqlup-alpine-linux-x86_64:${{ github.ref_name }} --os linux --arch=amd64
          docker manifest annotate vladimirdev635/gqlup-alpine:${{ github.ref_name }} vladimirdev635/gqlup-alpine-linux-arm64:${{ github.ref_name }} --os linux --arch=arm64
          docker manifest push vladimirdev635/gqlup-alpine:${{ github.ref_name }}
      - name: 'Copy all binaries'
        if: github.ref_type == 'tag'
        run: |
          container_id=$(docker create --pull always vladimirdev635/gqlup-darwin-x86_64:${{ github.ref_name }})
          docker cp $container_id:/gqlup ./gqlup-darwin-x86_64
          tar -cvzf ./gqlup-darwin-x86_64.tar.gz ./gqlup-darwin-x86_64
          docker rm $container_id

          container_id=$(docker create --pull always vladimirdev635/gqlup-darwin-arm64:${{ github.ref_name }})
          docker cp $container_id:/gqlup ./gqlup-darwin-arm64
          tar -cvzf ./gqlup-darwin-arm64.tar.gz ./gqlup-darwin-arm64
          docker rm $container_id

          container_id=$(docker create --pull always vladimirdev635/gqlup-linux-x86_64:${{ github.ref_name }})
          docker cp $container_id:/gqlup ./gqlup-linux-x86_64
          tar -cvzf ./gqlup-linux-x86_64.tar.gz ./gqlup-linux-x86_64
          docker rm $container_id

          container_id=$(docker create --pull always vladimirdev635/gqlup-linux-arm64:${{ github.ref_name }})
          docker cp $container_id:/gqlup ./gqlup-linux-arm64
          tar -cvzf ./gqlup-linux-arm64.tar.gz ./gqlup-linux-arm64
          docker rm $container_id
      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref_type == 'tag'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          title: "Release ${{ github.ref_name }}"
          prerelease: false
          files: |
            gqlup-linux-x86_64.tar.gz
            gqlup-linux-arm64.tar.gz
            gqlup-darwin-x86_64.tar.gz
            gqlup-darwin-arm64.tar.gz
